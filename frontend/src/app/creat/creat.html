<div class="cont">
    <mat-card class="example-card" appearance="outlined">
        <mat-card-header class="matc">
            <mat-card-title>{{title}}</mat-card-title>
        </mat-card-header>

        <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput placeholder="Name" #name type="text" [(ngModel)]="armyList().name">
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>pic</mat-label>
            <input matInput placeholder="pic" #pic type="text" [(ngModel)]="armyList().image">
        </mat-form-field>

        <mat-form-field>
            <mat-label>Status</mat-label>
            <mat-select #stat id="Status" class="list" [(ngModel)]="armyList().status">
                <mat-option value="Alive">Alive</mat-option>
                <mat-option value="Dead">Dead</mat-option>
                <mat-option value="Unknown">Unknown</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Species</mat-label>
            <input matInput placeholder="Species" #spec type="text" [(ngModel)]="armyList().species">
        </mat-form-field>

        <mat-form-field>
            <mat-label>Gender</mat-label>
            <mat-select #gend id="Gender" class="list" [(ngModel)]="armyList().gender">
                <mat-option value="Female">Female</mat-option>
                <mat-option value="Male">Male</mat-option>
                <mat-option value="Genderless">Genderless</mat-option>
                <mat-option value="Unknown">Unknown</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-card-content class="matc">
            <button class="g" matButton="elevated" (click)="addSolder(name.value,pic.value,
      stat.value,spec.value,gend.value)">
                {{btitle}}</button>
        </mat-card-content>
    </mat-card>

    <mat-card class="example-card" appearance="outlined">
        <mat-card-header class="matc">
            <mat-card-title>Kép előnézet</mat-card-title>
        </mat-card-header>
        <div class="cont2">

            <img mat-card-image width="400" height="400" [src]="armyList().image">
        </div>

    </mat-card>
</div>
